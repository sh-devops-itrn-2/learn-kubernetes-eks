apiVersion: v1
kind: Service
metadata:
  name: demo-svc
spec:
  type: ClusterIP
  selector:
    podName: pod-1
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: pod
metadata:
  name: demo-pod
  labels:
    podName: pod-1
spec:
  containers:
    - name: nginx
      image: nginx
